  <!-- Dynamic Canonical URL Synchronizer for Real-Time Hash & Route Indexing -->
  <script>
    (function() {
      function syncDynamicCanonical() {
        try {
          var canonicalLink = document.getElementById('dynamic-canonical') || document.querySelector("link[rel='canonical']");
          var currentUrl = new URL(window.location.href);
          var cleanParams = new URLSearchParams();
          currentUrl.searchParams.forEach(function(val, key) {
            // Retain essential query params like lang, remove ad tracking noise
            if (!key.startsWith('utm_') && key !== 'fbclid' && key !== 'gclid') {
              cleanParams.append(key, val);
            }
          });
          var cleanSearch = cleanParams.toString() ? ('?' + cleanParams.toString()) : '';
          var cleanHash = window.location.hash || '';
          var canonicalHref = currentUrl.origin + currentUrl.pathname + cleanSearch + cleanHash;
          
          if (!canonicalLink) {
            canonicalLink = document.createElement('link');
            canonicalLink.setAttribute('rel', 'canonical');
            canonicalLink.setAttribute('id', 'dynamic-canonical');
            document.head.appendChild(canonicalLink);
          }
          canonicalLink.setAttribute('href', canonicalHref);

          var ogUrlMeta = document.querySelector("meta[property='og:url']");
          if (ogUrlMeta) {
            ogUrlMeta.setAttribute('content', canonicalHref);
          }
        } catch(e) {}
      }
      syncDynamicCanonical();
      window.addEventListener('hashchange', syncDynamicCanonical);
      window.addEventListener('popstate', syncDynamicCanonical);
      window.addEventListener('soverix_route_change', syncDynamicCanonical);
    })();
