<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soverix Net - এডমিন প্যানেল (Master Admin Control Panel)</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/soverix_shield_logo.jpg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen">

  <div id="root">

    <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-950 text-white text-center">

      <p class="text-xs text-slate-400 mt-1 max-w-sm">

  <script type="module" src="/src/main.tsx"></script>
